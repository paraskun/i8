plugins {
    id 'java-library'
    id 'com.gradleup.shadow' version '9.2.2'
}

group = 'org.blab.oss.i8'
version = '0.0.0'

repositories {
    mavenCentral()
}

dependencies {
    compileOnlyApi('org.projectlombok:lombok:1.18.42')
    annotationProcessor('org.projectlombok:lombok:1.18.42')

    api('com.google.code.gson:gson:2.13.2')
    api('org.apache.avro:avro:1.12.1')

    api('org.apache.flink:flink-connector-base:2.1.0')
    api('org.apache.flink:flink-connector-kafka:4.0.1-2.0')
    api('org.apache.flink:flink-avro:2.1.1')

    compileOnlyApi('org.apache.flink:flink-streaming-java:2.1.0')
}

tasks.shadowJar {
    archiveFileName = 'node.jar'
}
