plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.7'
}

group = 'org.blab.oss.i8'
version = rootProject.version

repositories {
    mavenCentral()
}

dependencies {
    compileOnly("org.projectlombok:lombok:1.18.42")
    annotationProcessor("org.projectlombok:lombok:1.18.42")

    implementation("org.springframework.boot:spring-boot-starter-web:3.5.7")
    implementation("org.apache.kafka:kafka-clients:4.1.1")
    implementation("com.google.code.gson:gson:2.13.2")
    implementation 'net.lingala.zip4j:zip4j:2.11.5'
    implementation("org.apache.flink:flink-core:2.1.0")

    implementation(project(":node"))
    implementation(project(':boot'))

    testImplementation("org.apache.flink:flink-streaming-java:2.1.0")
    testImplementation("org.apache.flink:flink-clients:2.1.0")
    testImplementation(project(":node"))
    testImplementation(project(":plug:print"))
    testImplementation(project(":plug:write"))
}

tasks.bootJar {
    archiveFileName = 'core.jar'
}

tasks.register("install", Copy) {
    from "build/libs/core.jar"
    into "/usr/local/lib/i8"
}